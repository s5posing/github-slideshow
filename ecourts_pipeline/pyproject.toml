 [build-system]
 requires = ["setuptools>=61", "wheel"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "ecourts-pipeline"
 version = "0.1.0"
 description = "Scraping, parsing, and analysis pipeline for Indian High Court judgments"
 authors = [
     { name = "Research Automation" }
 ]
 readme = "README.md"
 requires-python = ">=3.10"
 dependencies = [
     "pandas>=2.0",
     "openpyxl>=3.1",
     "python-dateutil>=2.8",
     "thefuzz[speedup]>=0.22.1",
     "playwright>=1.48",
     "httpx>=0.27",
     "beautifulsoup4>=4.12",
     "lxml>=5.2",
     "pydantic>=2.8",
     "rich>=13.7",
     "tqdm>=4.66",
     "sqlalchemy>=2.0",
     "pypdf>=5.0",
     "pdfminer.six>=20240706",
     "pdf2image>=1.17",
     "pytesseract>=0.3",
     "scikit-learn>=1.5",
     "numpy>=1.26"
 ]

 [project.optional-dependencies]
 dev = [
     "pytest>=8.3",
     "ipython>=8.26"
 ]

 [tool.setuptools.packages.find]
 where = ["."]
